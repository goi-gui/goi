id = "goi"
name = "Goi"
version = "0.1.0"
schema_version = 1
description = "Goi design file (.goi) support: syntax highlighting, brackets, indentation and an element outline."
repository = "https://github.com/ksckaan1/goi"
authors = ["goi contributors"]
languages = ["languages/goi"]
capabilities = []

[lib]
kind = "Rust"
version = "0.1.0"

# Local development: Zed clones the grammar with a file:// URL, so the folder
# below must be its own git repository with the commit named in `rev`.
# To publish, replace this block with the grammar's real git URL:
#
#   [grammars.goi]
#   repository = "https://github.com/ksckaan1/goi"
#   path = "editors/zed/tree-sitter-goi"
#   rev = "<commit sha>"
[grammars.goi]
repository = "file:///home/ksckaan1/Documents/Dev/goui/editors/zed/tree-sitter-goi"
rev = "70e9dfe"

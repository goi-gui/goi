name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Native build matrix: GLFW is cgo, so cross-compiling is not the same as
    # building on the target. Each entry is run, not just compiled.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install GLFW (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev

      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Install GLFW (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glfw3:x64-windows

      - name: Vet
        shell: bash
        run: |
          go vet ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            go vet -tags x11 ./...
          fi

      - name: Test
        shell: bash
        # Headless packages only: the renderer and window need a display, so
        # those are exercised by the examples. Linux links the internal linker
        # because goffi's dynamic imports and the cgo SDL shim cannot share the
        # external one.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -ldflags=-linkmode=internal ./internal/syntax/ ./internal/schema/ ./internal/layout/ ./internal/paint/ ./internal/text/ ./internal/hotreload/ ./internal/lsp/ ./internal/goifmt/ ./ui/
          else
            go test -race ./internal/syntax/ ./internal/schema/ ./internal/layout/ ./internal/paint/ ./internal/text/ ./internal/hotreload/ ./internal/lsp/ ./internal/goifmt/ ./ui/
          fi

      - name: Build
        shell: bash
        # GLFW's cgo forces the external linker on Linux, which rejects goffi's
        # dynamic imports; -linkmode=internal is the documented workaround.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go build -ldflags=-linkmode=internal ./...
            go build -tags x11 -ldflags=-linkmode=internal ./...
          else
            go build ./...
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update && sudo apt-get install -y libglfw3-dev
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

name: ci

on:
  push:
    branches: [master]
  pull_request:

# The build is cgo-free: the window layer loads the SDL3 runtime library through
# purego, so no C toolchain or SDL development files are needed. The test job
# still installs the runtime library, because a test that opens a window needs
# it on the machine; everything else runs headless.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # SDL3's Linux package may not be available on every runner, so build the
      # runtime from source. No development files are needed by goi itself; this
      # is only for tests that open a window.
      - name: SDL3 runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libwayland-dev libdecor-0-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libxtst-dev libx11-dev libxext-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libxinerama-dev
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz" | tar xz
          cmake -S SDL3-3.4.20 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build --parallel
          sudo cmake --install sdl-build
          sudo ldconfig

      - name: SDL3 runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3

      - name: Build
        run: CGO_ENABLED=0 go build -tags nofakecgo ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet -tags nofakecgo ./...

      - name: Test
        run: CGO_ENABLED=0 go test -tags nofakecgo ./...

  # A plain Windows runner: the purego build needs no MSYS2, gcc or pkg-config.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      # PowerShell has no `VAR=value command`; the environment is a step key.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -tags nofakecgo ./...

  # The whole app cross-compiles from one machine: there is no cgo to ask for a
  # target toolchain, and SDL3 is only needed where the app runs.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: |
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags nofakecgo ./...
            done
          done

  # The browser build needs no display and no runtime library.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: GOOS=js GOARCH=wasm go build ./...
      - run: GOOS=js GOARCH=wasm go vet ./internal/platform ./internal/render
      - run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/platform
      # The browser-only piece that holds no DOM: the picker's accept string.
      # The keyboard map and cursor names are covered in internal/platform.
      - run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./ui -run PickAccept

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: CGO_ENABLED=0 staticcheck -tags nofakecgo ./...
      - run: CGO_ENABLED=0 go vet -tags nofakecgo ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: goifmt
        run: |
          out=$(go run ./cmd/goifmt -l .)
          if [ -n "$out" ]; then
            echo "$out"; exit 1
          fi

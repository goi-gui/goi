name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The platform layer is cgo over SDL3, so every target is built natively on
  # its own runner rather than cross-compiled.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      # SDL3's Linux packages do not carry the X11 and Wayland bits goi needs on
      # every runner, so Linux builds it from source with SDL's README-linux
      # dependency set.
      - name: SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libwayland-dev libdecor-0-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libxtst-dev libx11-dev libxext-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libxinerama-dev
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz" | tar xz
          cmake -S SDL3-3.4.20 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build --parallel
          sudo cmake --install sdl-build

      - name: SDL3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl3
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3

      - name: Build
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go build -ldflags=-linkmode=internal ./...
          else
            go build ./...
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go build ./...

      - name: Vet
        if: runner.os != 'Windows'
        run: go vet ./...

      # Headless packages only: the renderer and the window need a display, so
      # those are exercised by the examples. Linux links the internal linker
      # because goffi's dynamic imports and the cgo SDL shim cannot share the
      # external one. Tests that read a sibling checkout skip without it.
      - name: Test
        if: runner.os == 'Linux'
        run: go test -race -ldflags=-linkmode=internal ./internal/syntax ./internal/schema ./internal/layout ./internal/paint ./internal/text ./internal/hotreload ./internal/lsp ./internal/goifmt ./ui

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: go test -race ./internal/syntax ./internal/schema ./internal/layout ./internal/paint ./internal/text ./internal/hotreload ./internal/lsp ./internal/goifmt ./ui

  # Everything above internal/platform is pure Go, so it must cross-compile
  # without a C toolchain. This catches a cgo import leaking into a pure layer.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: |
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                ./internal/syntax ./internal/schema ./internal/tree ./internal/layout \
                ./internal/paint ./internal/text ./internal/render
            done
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: SDL3 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libwayland-dev libdecor-0-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libxtst-dev libx11-dev \
            libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev \
            libxss-dev libxinerama-dev
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz" | tar xz
          cmake -S SDL3-3.4.20 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build --parallel
          sudo cmake --install sdl-build

      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: goifmt
        run: |
          out=$(go run ./cmd/goifmt -l .)
          if [ -n "$out" ]; then
            echo "$out"; exit 1
          fi
